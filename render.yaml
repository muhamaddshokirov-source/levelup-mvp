services:
  - type: web
    name: levelup-coach
    runtime: docker
    plan: free
    branch: arena/e4114631-levelup-mvp
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    numInstances: 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_HOSTNAME
        value: muhamaddshokirov-source.github.io
      - key: ALLOWED_ORIGIN
        value: https://muhamaddshokirov-source.github.io
      - key: COACH_DAILY_LIMIT
        value: "50"
